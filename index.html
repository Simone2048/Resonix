<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#090a0f">
  <title>Resonix — Motion Theremin</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; touch-action: none; }
    body {
      background: #090a0f;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(22, 27, 34, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }
    h1 {
      font-size: 1.3rem;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #00f2fe, #ff007f);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(0, 242, 254, 0.15);
      border: 1px solid #00f2fe;
      color: #00f2fe;
      padding: 4px 8px;
      border-radius: 12px;
    }
    #stage {
      flex: 1;
      position: relative;
      background: radial-gradient(circle at center, #141724 0%, #090a0f 100%);
      cursor: crosshair;
    }
    #orb {
      position: absolute;
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle, #00f2fe 0%, rgba(0, 242, 254, 0.1) 70%, transparent 100%);
      transform: translate(-50%, -50%);
      pointer-events: none;
      transition: width 0.1s, height 0.1s;
      box-shadow: 0 0 30px #00f2fe;
      display: none;
    }
    .hud {
      position: absolute;
      bottom: 20px;
      left: 20px;
      font-family: monospace;
      font-size: 0.85rem;
      color: #8b949e;
      pointer-events: none;
    }
    /* Start Overlay (Browsers require a user click to start Audio & Sensors) */
    #overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 10, 15, 0.95);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      z-index: 20;
    }
    button.btn {
      background: linear-gradient(135deg, #00f2fe, #ff007f);
      border: none;
      color: #fff;
      padding: 14px 28px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
    }
    .subtext {
      color: #8b949e;
      font-size: 0.85rem;
      max-width: 280px;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>RESONIX</h1>
    <span class="badge" id="modeBadge">PC / Touch Mode</span>
  </header>

  <div id="stage">
    <div id="orb"></div>
    <div class="hud" id="hud">Pitch: -- Hz | Vol: --%</div>
  </div>

  <div id="overlay">
    <h2>Resonix Motion Theremin</h2>
    <p class="subtext">On PC: move your mouse.<br>On Phone: tilt your device in the air!</p>
    <button class="btn" id="startBtn">START THEREMIN</button>
  </div>

  <script>
    let audioCtx = null;
    let osc = null;
    let gainNode = null;
    let isRunning = false;

    const MIN_FREQ = 130;  // C3
    const MAX_FREQ = 900;  // A5
    const orb = document.getElementById('orb');
    const hud = document.getElementById('hud');
    const stage = document.getElementById('stage');
    const overlay = document.getElementById('overlay');
    const modeBadge = document.getElementById('modeBadge');

    function initAudio() {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      osc = audioCtx.createOscillator();
      gainNode = audioCtx.createGain();

      osc.type = 'sine'; // Ghostly theremin pure sine
      gainNode.gain.setValueAtTime(0, audioCtx.currentTime);

      osc.connect(gainNode);
      gainNode.connect(audioCtx.destination);
      osc.start();
      isRunning = true;
      orb.style.display = 'block';
    }

    function updateSound(normX, normY) {
      if (!isRunning) return;

      // Frequency based on X (0.0 to 1.0)
      const freq = MIN_FREQ + normX * (MAX_FREQ - MIN_FREQ);
      // Volume based on Y (Top = 1.0, Bottom = 0.0)
      const vol = Math.max(0, Math.min(1, 1 - normY));

      const now = audioCtx.currentTime;
      osc.frequency.setTargetAtTime(freq, now, 0.03); // Smooth portamento glide
      gainNode.gain.setTargetAtTime(vol * 0.35, now, 0.03);

      // Visual updates
      hud.innerText = `Pitch: ${Math.round(freq)} Hz | Vol: ${Math.round(vol * 100)}%`;
      const size = 50 + vol * 60;
      orb.style.width = `${size}px`;
      orb.style.height = `${size}px`;
    }

    // 1. PC & Touch Control (Mouse move / Drag)
    stage.addEventListener('pointermove', (e) => {
      const rect = stage.getBoundingClientRect();
      const normX = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const normY = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));

      orb.style.left = `${e.clientX}px`;
      orb.style.top = `${e.clientY}px`;
      updateSound(normX, normY);
    });

    // 2. Mobile Gyroscope / Tilt Mechanic
    function setupTilt() {
      window.addEventListener('deviceorientation', (event) => {
        if (event.gamma === null || event.beta === null) return;
        modeBadge.innerText = "Gyro Motion Mode";

        // Gamma = Left/Right tilt (-45 to 45 deg) -> Pitch
        let normX = (event.gamma + 35) / 70;
        normX = Math.max(0, Math.min(1, normX));

        // Beta = Front/Back tilt (10 to 60 deg) -> Volume
        let normY = 1 - ((event.beta - 10) / 50);
        normY = Math.max(0, Math.min(1, normY));

        const rect = stage.getBoundingClientRect();
        orb.style.left = `${rect.left + normX * rect.width}px`;
        orb.style.top = `${rect.top + normY * rect.height}px`;

        updateSound(normX, normY);
      });
    }

    // 3. User Activation & Gyro Permission Handling
    document.getElementById('startBtn').addEventListener('click', async () => {
      initAudio();
      overlay.style.display = 'none';

      // iOS 13+ requires explicit permission request for accelerometer/gyroscope
      if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
        try {
          const permission = await DeviceOrientationEvent.requestPermission();
          if (permission === 'granted') {
            setupTilt();
          }
        } catch (e) {
          console.error(e);
        }
      } else {
        // Android and standard browsers
        setupTilt();
      }
    });

    // 4. Register Offline PWA Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>
</body>
</html>
